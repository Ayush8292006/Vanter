<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0B0B0B" />
  <defs>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DE9C" />
      <stop offset="40%" stop-color="#C9A45C" />
      <stop offset="75%" stop-color="#E4CA88" />
      <stop offset="100%" stop-color="#8E6721" />
    </linearGradient>
  </defs>
  <g transform="translate(150, 80) scale(1.0)" fill="url(#logoGoldGrad)">
    <!-- Monogram Left Wing -->
    <polygon points="45,60 95,60 150,225 150,245 138,245 45,60" />
    <!-- Monogram Right Wing -->
    <polygon points="255,60 205,60 150,225 150,245 162,245 255,60" />
    <!-- Center Inverted Triangle -->
    <polygon points="112,60 188,60 150,140" />
    <!-- Inner faceted stem -->
    <polygon points="150,152 142,215 150,235 158,215" />
  </g>
  <!-- Wordmark -->
  <text
    x="300"
    y="440"
    font-family="'Cinzel', 'Cormorant Garamond', serif"
    font-size="44"
    fill="url(#logoGoldGrad)"
    text-anchor="middle"
    letter-spacing="18"
  >
    VANTÉR
  </text>
  <text
    x="300"
    y="485"
    font-family="'Jost', system-ui, sans-serif"
    font-size="12"
    fill="#8C7F6E"
    text-anchor="middle"
    letter-spacing="10"
  >
    MAISON DE PARFUM
  </text>
</svg>

